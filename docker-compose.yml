services:
  postgres:
    image: postgres:16-alpine
    container_name: t2s-postgres
    environment:
      POSTGRES_USER: t2s
      POSTGRES_PASSWORD: t2s
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t2s -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
